name: build-aurora-windows

on:
  push:
    branches:
      - fix/safari-download-toolbar-sidebar
    paths-ignore:
      - ".github/workflows/build-aurora.yml"
  workflow_dispatch:
    inputs:
      webkit_sha:
        description: "WebKit commit SHA (only when explicitly rebuilding WebKit)"
        required: false
        type: string
      rebuild_webkit:
        description: "Rebuild the WebKit engine (leave off for normal Aurora builds)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 720
    env:
      WEBKIT_DIR: D:\a\_temp\WebKit
      AURORA_REF: ${{ github.ref_name }}
    steps:
      - name: Checkout Aurora source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure git line endings
        shell: powershell
        run: |
          git config --global core.autocrlf input
          git config --global core.longpaths true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies (WinGet)
        shell: powershell
        run: |
          $common = @(
            "--accept-package-agreements",
            "--accept-source-agreements",
            "--disable-interactivity",
            "--silent"
          )
          $machineScope = @("--scope=machine")
          $packages = @(
            "Git.Git",
            "Kitware.CMake",
            "Ninja-build.Ninja",
            "RubyInstallerTeam.Ruby.3.2",
            "ApacheFriends.Xampp.8.2",
            "LLVM.LLVM"
          )
          foreach ($pkg in $packages) {
            winget install @common @machineScope --id $pkg
          }
          winget install @common --id GnuWin32.Gperf

      - name: Resolve WebKit SHA (pinned default)
        id: webkit-sha
        env:
          WEBKIT_SHA_INPUT: ${{ github.event.inputs.webkit_sha }}
          REBUILD_WEBKIT: ${{ inputs.rebuild_webkit }}
        shell: powershell
        run: |
          # Reuse the exact WebKit revision from the last successful full build.
          # Set the workflow input when intentionally upgrading WebKit.
          $knownGoodSha = "a4e704f79fccaab616b4aadd590d3360bcae4b70"
          $inputSha = $env:WEBKIT_SHA_INPUT
          if ($env:REBUILD_WEBKIT -eq "true" -and [string]::IsNullOrWhiteSpace($inputSha)) {
            throw "A WebKit rebuild requires an explicit new webkit_sha. Supply the new full commit SHA and enable Rebuild WebKit."
          }
          if (-not [string]::IsNullOrWhiteSpace($inputSha)) {
            $sha = $inputSha.Trim()
            if ($sha -notmatch '^[0-9a-fA-F]{40}$') {
              throw "webkit_sha must be a full 40-character Git commit SHA."
            }
            $sha = $sha.ToLowerInvariant()
          } else {
            $sha = $knownGoodSha
            Write-Host "Using the last successful WebKit revision: $sha"
          }
          if ($sha -notmatch '^[0-9a-fA-F]{40}$') { throw "Resolved WebKit revision is not a full 40-character Git commit SHA." }
          # An explicit rebuild may intentionally reuse the pinned WebKit SHA to
          # refresh a stale/incomplete saved build. Do not require an engine upgrade
          # just to regenerate the cached objects for the existing engine revision.
          if ($env:REBUILD_WEBKIT -eq "true" -and $sha -eq $knownGoodSha) {
            Write-Host "Explicit rebuild requested for the existing pinned WebKit revision; the source SHA will remain unchanged."
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sha=$sha$([Environment]::NewLine)", [System.Text.UTF8Encoding]::new($false))

      - name: Resolve WebKit compiler fingerprint
        id: build-fingerprint
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw "Visual Studio C++ toolchain was not found." }
          $msvcRoot = Join-Path $vsInstall "VC\Tools\MSVC"
          $msvc = Get-ChildItem -LiteralPath $msvcRoot -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $msvc) { throw "MSVC toolset was not found under $msvcRoot." }

          $clang = Join-Path $env:ProgramFiles "LLVM\bin\clang-cl.exe"
          if (-not (Test-Path $clang)) { throw "clang-cl was not found at $clang." }
          # Read executable metadata instead of piping clang-cl --version through Select-Object:
          # that can close the native process output pipe early and leave exit code 1 for Actions.
          $clangInfo = (Get-Item -LiteralPath $clang).VersionInfo
          $clangVersionRaw = $clangInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($clangVersionRaw)) { $clangVersionRaw = $clangInfo.FileVersion }
          if ([string]::IsNullOrWhiteSpace($clangVersionRaw)) { throw "Could not read the installed clang-cl version metadata at $clang." }
          if ($clangVersionRaw -notmatch '([0-9]+(?:\.[0-9]+){1,3})') { throw "Could not parse clang-cl version metadata: $clangVersionRaw" }
          $clangVersion = $Matches[1]
          Write-Host "clang-cl version: $clangVersion (metadata: $clangVersionRaw)"

          $sdkRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\Include"
          $sdk = Get-ChildItem -LiteralPath $sdkRoot -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Windows SDK was not found under $sdkRoot." }
          $clVersion = (Get-Item -LiteralPath (Join-Path $msvc.FullName "bin\Hostx64\x64\cl.exe")).VersionInfo.FileVersion

          $source = "$($msvc.Name)|$clVersion|$clangVersion|$($sdk.Name)"
          $hash = [System.Security.Cryptography.SHA256]::Create()
          try {
            $fingerprint = [System.BitConverter]::ToString($hash.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($source))).Replace("-", "").ToLowerInvariant().Substring(0,20)
          } finally { $hash.Dispose() }
          Write-Host "WebKit compiler fingerprint: $fingerprint (MSVC $($msvc.Name), clang $clangVersion, SDK $($sdk.Name))"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "fingerprint=$fingerprint$([Environment]::NewLine)clang_version=$clangVersion$([Environment]::NewLine)sdk_version=$($sdk.Name)$([Environment]::NewLine)", [System.Text.UTF8Encoding]::new($false))

      # The key changes only when the engine, compiler toolchain, or CMake graph changes.
      # Fallback restore lets the last good engine be migrated without throwing it away.
      - name: Restore saved WebKit build
        id: cache-webkit-src
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WEBKIT_DIR }}
          key: webkit-src-v3-${{ runner.os }}-${{ steps.webkit-sha.outputs.sha }}-${{ steps.build-fingerprint.outputs.fingerprint }}-${{ hashFiles('CMakeLists.txt', 'cmake/WebKitProjectHook.cmake') }}
          restore-keys: |
            webkit-src-v3-${{ runner.os }}-${{ steps.webkit-sha.outputs.sha }}-${{ steps.build-fingerprint.outputs.fingerprint }}-
            webkit-src-v2-${{ runner.os }}-${{ steps.webkit-sha.outputs.sha }}-${{ steps.build-fingerprint.outputs.fingerprint }}-
            webkit-src-v2-${{ runner.os }}-${{ steps.webkit-sha.outputs.sha }}-
            webkit-src-${{ runner.os }}-${{ steps.webkit-sha.outputs.sha }}-
            webkit-src-${{ runner.os }}-${{ steps.webkit-sha.outputs.sha }}

      - name: Report restored WebKit cache
        if: steps.cache-webkit-src.outputs.cache-matched-key != ''
        shell: powershell
        env:
          CACHE_MATCHED_KEY: ${{ steps.cache-webkit-src.outputs.cache-matched-key }}
          CACHE_EXACT_HIT: ${{ steps.cache-webkit-src.outputs.cache-hit }}
        run: |
          Write-Host "Exact cache hit: $env:CACHE_EXACT_HIT"
          Write-Host "Restored cache key: $env:CACHE_MATCHED_KEY"

      - name: Require saved WebKit build for normal browser builds
        if: steps.cache-webkit-src.outputs.cache-matched-key == '' && (github.event_name != 'workflow_dispatch' || inputs.rebuild_webkit != true)
        shell: powershell
        run: |
          throw "No saved WebKit build was found for the pinned SHA. This browser build will not rebuild WebKit automatically. Re-run this workflow manually and enable 'Rebuild WebKit' only when an intentional WebKit rebuild is needed."

      - name: Clone WebKit for an explicitly requested rebuild
        if: steps.cache-webkit-src.outputs.cache-matched-key == '' && github.event_name == 'workflow_dispatch' && inputs.rebuild_webkit == true
        env:
          WEBKIT_SHA: ${{ steps.webkit-sha.outputs.sha }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:WEBKIT_DIR | Out-Null
          if (-not (Test-Path (Join-Path $env:WEBKIT_DIR ".git"))) {
            git -C $env:WEBKIT_DIR init
            git -C $env:WEBKIT_DIR remote add origin https://github.com/WebKit/WebKit.git
          }
          git -C $env:WEBKIT_DIR fetch --depth 1 origin $env:WEBKIT_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch requested WebKit revision $env:WEBKIT_SHA" }
          git -C $env:WEBKIT_DIR checkout --force --detach $env:WEBKIT_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not check out requested WebKit revision $env:WEBKIT_SHA" }

      - name: Verify WebKit checkout
        if: steps.cache-webkit-src.outputs.cache-matched-key != '' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_webkit == true)
        env:
          WEBKIT_SHA: ${{ steps.webkit-sha.outputs.sha }}
        shell: powershell
        run: |
          $script = Join-Path $env:WEBKIT_DIR "Tools\Scripts\build-webkit"
          if (-not (Test-Path $script)) {
            throw "WebKit checkout missing build-webkit. Clone may be incomplete."
          }
          $actualSha = (git -C $env:WEBKIT_DIR rev-parse HEAD).Trim()
          $expectedSha = $env:WEBKIT_SHA
          if ($actualSha -ne $expectedSha) {
            throw "WebKit checkout SHA mismatch. Expected $expectedSha, got $actualSha."
          }

      - name: Add resumable download C API to cached WebKit source
        shell: powershell
        run: |
          $source = Join-Path $env:WEBKIT_DIR "Source\WebKit\UIProcess\API\C\WKPage.cpp"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "WebKit WKPage.cpp not found at $source"
          }

          $sourceText = [System.IO.File]::ReadAllText($source)
          if ($sourceText.Contains("WKPageResumeDownloadFromResumeData")) {
            Write-Host "WebKit already contains Aurora's resume-download wrapper."
          } else {
            # Insert before a stable function-name anchor instead of using a line-numbered
            # git patch. The cached WebKit file can have different line endings or offsets.
            $anchor = "void WKPageLoadURLRequestWithUserData("
            $anchorIndex = $sourceText.IndexOf($anchor, [System.StringComparison]::Ordinal)
            if ($anchorIndex -lt 0) {
              throw "Could not find the WKPageLoadURLRequestWithUserData insertion point in WKPage.cpp."
            }

            $wrapper = @'
          using AuroraWKPageResumeDownloadCallback = void (*)(WKDownloadRef, const void*);

          extern "C" WK_EXPORT void WKPageResumeDownloadFromResumeData(
              WKPageRef pageRef,
              WKDataRef resumeDataRef,
              WKStringRef pathRef,
              const void* functionContext,
              AuroraWKPageResumeDownloadCallback callback)
          {
              if (!callback)
                  return;

              if (!pageRef || !resumeDataRef || !pathRef) {
                  callback(nullptr, functionContext);
                  return;
              }

              protect(toImpl(pageRef))->resumeDownload(*toImpl(resumeDataRef), toWTFString(pathRef),
                  [functionContext, callback](auto* download) {
                      callback(download ? toAPI(download) : nullptr, functionContext);
                  });
          }
          '@
            $sourceText = $sourceText.Insert($anchorIndex, $wrapper + [Environment]::NewLine + [Environment]::NewLine)
            [System.IO.File]::WriteAllText($source, $sourceText, [System.Text.UTF8Encoding]::new($false))
          }

          $updatedSource = [System.IO.File]::ReadAllText($source)
          if (-not $updatedSource.Contains("WKPageResumeDownloadFromResumeData")) {
            throw "The resumable download wrapper was not written to WKPage.cpp."
          }

      - name: Patch rewrite-compile-commands (Windows guard)
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_webkit == true
        shell: powershell
        run: |
          $script = Join-Path $env:WEBKIT_DIR "Tools\Scripts\rewrite-compile-commands"
          if (-not (Test-Path $script)) {
            throw "rewrite-compile-commands not found in WebKit checkout."
          }
          $content = Get-Content -Raw $script
          $old = "    parent_dir_1, parent_dir_2 = entry_file.rsplit(os.path.sep, maxsplit=4)[1:3]"
          $new = "    parts = entry_file.rsplit(os.path.sep, maxsplit=4)`n    if len(parts) < 3:`n        continue`n    parent_dir_1, parent_dir_2 = parts[1:3]"
          if ($content -match [regex]::Escape($old)) {
            $content = $content.Replace($old, $new)
            Set-Content -Path $script -Value $content -NoNewline
          } else {
            Write-Host "rewrite-compile-commands patch target not found; skipping patch."
          }

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywin32

      - name: Build WebKit (Release, with Aurora in the same CMake graph)
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_webkit == true
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found. Install Visual Studio with Desktop C++ workload." }
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw "Visual Studio with C++ tools not found." }

          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          $vcpkgRoot = Join-Path $vsInstall "VC\vcpkg"
          if (-not (Test-Path (Join-Path $vcpkgRoot "vcpkg.exe"))) { throw "Visual Studio vcpkg.exe not found under $vcpkgRoot" }

          $env:VCPKG_ROOT = $vcpkgRoot
          # Store vcpkg binary archives alongside the configured engine so the WebKit snapshot retains them.
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:WEBKIT_DIR "VcpkgBinaryCache"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:PATH = "C:\xampp\apache\bin;C:\xampp\perl\bin;C:\xampp\mysql\bin;C:\Program Files\CMake\bin;C:\Program Files\Ninja;C:\Program Files\Git\usr\bin;C:\Program Files\Git\bin;C:\Program Files\LLVM\bin;C:\Program Files (x86)\GnuWin32\bin;$env:PATH"
          $env:PYTHON = "python"
          $env:PYTHON3 = "python"
          $env:CMAKE_EXPORT_COMPILE_COMMANDS = "OFF"
          $env:WEBKIT_LIBRARIES = Join-Path $env:WEBKIT_DIR "WebKitLibraries\win"
          $env:WEBKIT_OUTPUTDIR = Join-Path $env:WEBKIT_DIR "WebKitBuild"
          $env:WEBKIT_TESTFONTS = Join-Path $env:WEBKIT_DIR "Tools\WebKitTestRunner\fonts"
          $env:DUMPRENDERTREE_TEMP = $env:TEMP
          $env:CC = "clang-cl"
          $env:CXX = "clang-cl"
          $env:PATH = "$env:WEBKIT_LIBRARIES\bin;$env:PATH"

          # build-webkit manages its configuration cache under WebKitBuild\Release.
          # Leave that cache intact here; build-webkit invalidates it when its arguments change.
          $auroraRoot = $env:GITHUB_WORKSPACE
          $auroraHook = Join-Path $auroraRoot "cmake\WebKitProjectHook.cmake"
          if (-not (Test-Path $auroraHook)) { throw "Aurora CMake hook not found at $auroraHook" }
          $cmakeArgs = "-DCMAKE_EXPORT_COMPILE_COMMANDS=OFF -DCMAKE_PROJECT_INCLUDE:FILEPATH=$auroraHook -DAURORA_SOURCE_DIR:PATH=$auroraRoot"
          cmd /c "call `"$vcvars`" && cd /d `"$env:WEBKIT_DIR`" && perl Tools\Scripts\build-webkit --release --cmakeargs=`"$cmakeArgs`""
          if ($LASTEXITCODE -ne 0) { throw "build-webkit failed with exit code $LASTEXITCODE" }

      - name: Verify saved WebKit build is ready
        shell: powershell
        env:
          WEBKIT_SHA: ${{ steps.webkit-sha.outputs.sha }}
        run: |
          $actualSha = (git -C $env:WEBKIT_DIR rev-parse HEAD).Trim()
          if ($actualSha -ne $env:WEBKIT_SHA) {
            throw "Saved WebKit snapshot SHA mismatch. Expected $env:WEBKIT_SHA, got $actualSha."
          }
          $buildDir = Join-Path $env:WEBKIT_DIR "WebKitBuild\Release"
          if (-not (Test-Path (Join-Path $buildDir "CMakeCache.txt"))) {
            throw "The saved WebKit snapshot has no configured Release build. Use Run workflow and enable 'Rebuild WebKit' to create a new snapshot."
          }
          $runtimeDirs = @(
            (Join-Path $buildDir "bin"),
            (Join-Path $buildDir "bin64")
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Container }
          if ($runtimeDirs.Count -eq 0) {
            throw "The saved WebKit build has no bin/bin64 runtime directory. Use Run workflow and enable 'Rebuild WebKit' to recreate the snapshot."
          }

      - name: Prepare saved WebKit graph for incremental builds
        if: steps.cache-webkit-src.outputs.cache-matched-key != '' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_webkit == true)
        env:
          CURRENT_BUILD_FINGERPRINT: ${{ steps.build-fingerprint.outputs.fingerprint }}
          CURRENT_CLANG_VERSION: ${{ steps.build-fingerprint.outputs.clang_version }}
          CURRENT_SDK_VERSION: ${{ steps.build-fingerprint.outputs.sdk_version }}
          CURRENT_CMAKE_HASH: ${{ hashFiles('CMakeLists.txt', 'cmake/WebKitProjectHook.cmake') }}
          REBUILD_WEBKIT: ${{ inputs.rebuild_webkit }}
        shell: powershell
        run: |
          $buildDir = Join-Path $env:WEBKIT_DIR "WebKitBuild\Release"
          $buildNinja = Join-Path $buildDir "build.ninja"
          $cacheFile = Join-Path $buildDir "CMakeCache.txt"
          if (-not (Test-Path -LiteralPath $buildNinja)) { throw "Configured Ninja graph not found at $buildNinja." }
          if (-not (Test-Path -LiteralPath $cacheFile)) { throw "CMakeCache.txt not found at $cacheFile." }

          $metadataPath = Join-Path $env:WEBKIT_DIR ".aurora-build-cache-metadata"
          $metadata = @{}
          if (Test-Path -LiteralPath $metadataPath) {
            foreach ($line in Get-Content -LiteralPath $metadataPath) {
              $pair = $line -split '=', 2
              if ($pair.Count -eq 2) { $metadata[$pair[0]] = $pair[1] }
            }
          }

          $allowIncremental = $false
          if ($metadata.ContainsKey("fingerprint") -and $metadata.ContainsKey("cmake_hash")) {
            $allowIncremental = $metadata["fingerprint"] -eq $env:CURRENT_BUILD_FINGERPRINT -and $metadata["cmake_hash"] -eq $env:CURRENT_CMAKE_HASH
            Write-Host "Saved cache metadata present; toolchain and CMake integration compatibility: $allowIncremental"
          } else {
            # Compiler compatibility alone cannot prove that the cached build graph was
            # configured with this exact Aurora hook. Do not upgrade an unverifiable
            # legacy snapshot to trusted metadata during a normal UI-only build.
            Write-Host "Saved WebKit cache has no Aurora compatibility metadata."
            Write-Host "A normal build will not trust this legacy cache; explicitly rebuild WebKit to create a verified snapshot."
          }

          # Never silently turn a normal Aurora/UI build into an engine rebuild.
          # A fallback cache may have been built with a different compiler, SDK, or
          # CMake graph; cmake --build can then regenerate the graph and compile thousands
          # of JavaScriptCore/WebCore objects even when Rebuild WebKit was not requested.
          if (-not $allowIncremental -and $env:REBUILD_WEBKIT -ne "true") {
            $cachedFingerprint = if ($metadata.ContainsKey("fingerprint")) { $metadata["fingerprint"] } else { "legacy/missing" }
            $cachedCMakeHash = if ($metadata.ContainsKey("cmake_hash")) { $metadata["cmake_hash"] } else { "legacy/missing" }
            Write-Host "Cached toolchain fingerprint: $cachedFingerprint"
            Write-Host "Current toolchain fingerprint: $env:CURRENT_BUILD_FINGERPRINT"
            Write-Host "Cached CMake graph hash: $cachedCMakeHash"
            Write-Host "Current CMake graph hash: $env:CURRENT_CMAKE_HASH"
            throw "Refusing an implicit WebKit rebuild. This normal Aurora build needs an exact compatible WebKit cache. Select Rebuild WebKit only when you intentionally want to compile the engine."
          }

          $metadataText = "fingerprint=$env:CURRENT_BUILD_FINGERPRINT$([Environment]::NewLine)cmake_hash=$env:CURRENT_CMAKE_HASH$([Environment]::NewLine)"
          [System.IO.File]::WriteAllText($metadataPath, $metadataText, [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory -Force -Path (Join-Path $env:WEBKIT_DIR "VcpkgBinaryCache") | Out-Null

          if ($allowIncremental) {
            # Cache metadata already verified the pinned engine SHA, compiler fingerprint,
            # and Aurora CMake integration hash. The fresh checkout can make the identical
            # hook appear newer by timestamp, causing a redundant CMake/vcpkg rerun.
            # Disable only the generated manifest's auto-regeneration edge for this
            # exact-compatible cache; the dry-run guard below still rejects stale objects.
            $manifestText = [System.IO.File]::ReadAllText($buildNinja)
            $newline = [Environment]::NewLine
            $manifestLines = [regex]::Split($manifestText, '\r\n|\n|\r')
            $targetRules = @()
            for ($lineIndex = 0; $lineIndex -lt $manifestLines.Length; $lineIndex++) {
              $line = $manifestLines[$lineIndex]
              # CMake/Ninja may put build.ninja and many other generated files on the
              # same multi-output edge. Match the rule delimiter (colon + whitespace),
              # not the first colon, because Windows drive letters contain escaped "$:".
              if ($line -match '^\s*build\s+(.*?)\s*:\s+(RERUN_CMAKE|phony)\b') {
                $outputs = @($Matches[1] -split '\s+')
                if ($outputs -contains 'build.ninja') {
                  $targetRules += [pscustomobject]@{
                    Index = $lineIndex
                    Rule = $Matches[2]
                    Outputs = $outputs
                    Line = $line
                  }
                }
              }
            }

            if ($targetRules.Count -eq 1 -and $targetRules[0].Rule -eq "RERUN_CMAKE") {
              $edgeIndex = $targetRules[0].Index
              $manifestLines[$edgeIndex] = 'build build.ninja: phony'
              # Remove edge-specific assignments (typically pool/restat) that belonged
              # to RERUN_CMAKE; they are not needed for a phony edge.
              for ($nextLine = $edgeIndex + 1; $nextLine -lt $manifestLines.Length; $nextLine++) {
                if ($manifestLines[$nextLine] -match '^\s+[A-Za-z0-9_]+\s*=') {
                  $manifestLines[$nextLine] = ""
                } else {
                  break
                }
              }
              $manifestText = [string]::Join($newline, $manifestLines)
              [System.IO.File]::WriteAllText($buildNinja, $manifestText, [System.Text.UTF8Encoding]::new($false))
              Write-Host "Disabled timestamp-only CMake regeneration for the verified compatible cache."
            } elseif ($targetRules.Count -eq 1 -and $targetRules[0].Rule -eq "phony") {
              Write-Host "Timestamp-only CMake regeneration is already disabled in this cached graph."
            } else {
              $edgeDiagnostics = @($manifestLines | Where-Object {
                $_ -match '(?i)build.*build\.ninja:|RERUN_CMAKE'
              } | Select-Object -First 12)
              Write-Host "Could not identify exactly one expected build.ninja regeneration edge."
              $edgeDiagnostics | ForEach-Object {
                $preview = $_.ToString()
                if ($preview.Length -gt 600) { $preview = $preview.Substring(0, 600) + " ... [truncated]" }
                Write-Host "  $preview"
              }
              throw "Could not safely identify the cached build.ninja regeneration edge. Refusing to risk an implicit WebKit rebuild."
            }

            $verifiedManifest = [System.IO.File]::ReadAllText($buildNinja)
            $remainingRerunEdges = @()
            $verifiedLines = [regex]::Split($verifiedManifest, '\r\n|\n|\r')
            foreach ($line in $verifiedLines) {
              if ($line -match '^\s*build\s+(.*?)\s*:\s+RERUN_CMAKE\b') {
                $outputs = @($Matches[1] -split '\s+')
                if ($outputs -contains 'build.ninja') { $remainingRerunEdges += $line }
              }
            }
            if ($remainingRerunEdges.Count -gt 0) {
              throw "The cached build.ninja regeneration edge remains enabled. Refusing to risk an implicit WebKit rebuild."
            }
            Write-Host "Cached compiler/configuration are compatible; reusing the cached graph."
          } else {
            Write-Host "Cached compiler or CMake graph differs; allowing CMake to regenerate."
          }

      - name: Guard against implicit WebKit rebuilds
        if: inputs.rebuild_webkit != true
        shell: powershell
        run: |
          $buildDir = Join-Path $env:WEBKIT_DIR "WebKitBuild\Release"
          # cmake --build --config Release uses build-Release.ninja when the
          # cached generator is Ninja Multi-Config. Inspect that exact graph.
          $manifestName = "build.ninja"
          if (Test-Path -LiteralPath (Join-Path $buildDir "build-Release.ninja") -PathType Leaf) {
            $manifestName = "build-Release.ninja"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $buildDir $manifestName) -PathType Leaf)) {
            throw "Configured Ninja graph '$manifestName' is missing; refusing to attempt an implicit WebKit build."
          }

          $ninja = "C:\Program Files\Ninja\ninja.exe"
          if (-not (Test-Path -LiteralPath $ninja)) {
            $ninjaCommand = Get-Command ninja -ErrorAction SilentlyContinue
            if ($ninjaCommand) { $ninja = $ninjaCommand.Source }
            else { throw "Ninja was not found; refusing to start an unverified Aurora build." }
          }

          # Inspect the exact work Ninja plans to do, without compiling objects.
          # Merge standard output/error so Windows PowerShell can report Ninja diagnostics.
          Write-Host "Checking incremental Release build plan using $manifestName."
          $plan = @(& $ninja -C $buildDir -f $manifestName -n Aurora 2>&1)
          if ($LASTEXITCODE -ne 0) {
            Write-Host ($plan -join "`n")
            throw "Could not inspect the incremental build plan (exit code $LASTEXITCODE). Refusing to proceed."
          }

          # A stale CMake regeneration edge is safe to refresh by requesting only
          # the generated manifest target. This runs CMake configure/generation,
          # not the Aurora or WebKit compilation targets.
          $cmakeRegeneration = @($plan | Where-Object {
            $_.ToString() -match '(?i)(Re-running CMake|RERUN_CMAKE|cmake_check_build_system|--regenerate-during-build)'
          })
          if ($cmakeRegeneration.Count -gt 0) {
            Write-Host "Cached CMake graph is stale. Regenerating the Ninja manifest only; no compile target will be invoked."
            # CMake can emit non-fatal warnings on stderr while successfully
            # regenerating the graph. Windows PowerShell 5.1 can promote native
            # stderr to a terminating NativeCommandError, so capture both streams
            # through Start-Process and evaluate the real process exit code.
            $graphOutPath = Join-Path $env:RUNNER_TEMP "aurora-cmake-graph.out"
            $graphErrPath = Join-Path $env:RUNNER_TEMP "aurora-cmake-graph.err"
            Remove-Item -LiteralPath $graphOutPath, $graphErrPath -Force -ErrorAction SilentlyContinue
            $graphArgs = '-C "' + $buildDir + '" build.ninja'
            $graphProcess = Start-Process -FilePath $ninja -ArgumentList $graphArgs -NoNewWindow -Wait -PassThru -RedirectStandardOutput $graphOutPath -RedirectStandardError $graphErrPath
            $graphExitCode = $graphProcess.ExitCode
            if (Test-Path -LiteralPath $graphOutPath) {
              Get-Content -LiteralPath $graphOutPath | Select-Object -Last 30 | ForEach-Object { Write-Host $_ }
            }
            if (Test-Path -LiteralPath $graphErrPath) {
              Get-Content -LiteralPath $graphErrPath | Select-Object -Last 30 | ForEach-Object { Write-Host $_ }
            }
            if ($graphExitCode -ne 0) {
              throw "CMake graph-only regeneration failed with exit code $graphExitCode. Aurora/WebKit compilation was not started."
            }

            # Re-check the refreshed graph before any compilation can begin.
            $plan = @(& $ninja -C $buildDir -f $manifestName -n Aurora 2>&1)
            if ($LASTEXITCODE -ne 0) {
              Write-Host ($plan -join "`n")
              throw "Could not inspect the regenerated incremental build plan. Aurora/WebKit compilation was not started."
            }
          }

          # After graph-only regeneration, both another CMake regen and stale engine
          # objects are hard stops. This prevents configuration changes from silently
          # turning a UI-only build into a full WebKit rebuild.
          $planText = $plan -join "`n"
          $cmakeRegeneration = @($plan | Where-Object {
            $_.ToString() -match '(?i)(Re-running CMake|RERUN_CMAKE|cmake_check_build_system|--regenerate-during-build)'
          })
          if ($cmakeRegeneration.Count -gt 0) {
            Write-Host "Ninja still reports CMake regeneration after refreshing the graph:"
            $cmakeRegeneration | Select-Object -First 8 | ForEach-Object { Write-Host $_.ToString() }
            throw "Refusing this Aurora build because the CMake graph remains stale. No WebKit compilation was started."
          }

          $webkitCompiles = [regex]::Matches(
            $planText,
            '(?im)^\s*\[\d+/\d+\]\s+Building\s+(?:C|CXX|ASM|OBJCXX)\s+object\s+Source[\\/](?:WebCore|JavaScriptCore|WTF|WebKit)[\\/]'
          )
          if ($webkitCompiles.Count -gt 0) {
            Write-Host "Ninja plans to rebuild $($webkitCompiles.Count) WebKit C/C++ objects:"
            $webkitCompiles | Select-Object -First 8 | ForEach-Object { Write-Host $_.Value }
            throw "Refusing this normal Aurora build because WebKit objects are stale or missing. Use 'Rebuild WebKit' only when an intentional full engine rebuild is wanted."
          }

          Write-Host "Incremental preflight passed: no WebCore, JavaScriptCore, WTF, or WebKit objects need recompilation."

      - name: Build Aurora target from the configured WebKit graph
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw "Visual Studio with C++ tools not found." }
          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          $vcpkgRoot = Join-Path $vsInstall "VC\vcpkg"
          if (-not (Test-Path (Join-Path $vcpkgRoot "vcpkg.exe"))) { throw "Visual Studio vcpkg.exe not found under $vcpkgRoot" }

          # Each Actions step starts with a fresh process environment. Recreate
          # the same tool and WebKit paths used by the WebKit build step.
          $env:VCPKG_ROOT = $vcpkgRoot
          # Store vcpkg binary archives alongside the configured engine so the WebKit snapshot retains them.
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:WEBKIT_DIR "VcpkgBinaryCache"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:PATH = "C:\xampp\apache\bin;C:\xampp\perl\bin;C:\xampp\mysql\bin;C:\Program Files\CMake\bin;C:\Program Files\Ninja;C:\Program Files\Git\usr\bin;C:\Program Files\Git\bin;C:\Program Files\LLVM\bin;C:\Program Files (x86)\GnuWin32\bin;$env:PATH"
          $env:PYTHON = "python"
          $env:PYTHON3 = "python"
          $env:CMAKE_EXPORT_COMPILE_COMMANDS = "OFF"
          $env:WEBKIT_LIBRARIES = Join-Path $env:WEBKIT_DIR "WebKitLibraries\win"
          $env:WEBKIT_OUTPUTDIR = Join-Path $env:WEBKIT_DIR "WebKitBuild"
          $env:WEBKIT_TESTFONTS = Join-Path $env:WEBKIT_DIR "Tools\WebKitTestRunner\fonts"
          $env:DUMPRENDERTREE_TEMP = $env:TEMP
          $env:CC = "clang-cl"
          $env:CXX = "clang-cl"
          $env:PATH = "$env:WEBKIT_LIBRARIES\bin;$env:PATH"

          $buildDir = Join-Path $env:WEBKIT_DIR "WebKitBuild\Release"
          if (-not (Test-Path (Join-Path $buildDir "CMakeCache.txt"))) { throw "WebKit CMake build directory not found at $buildDir" }
          # The cached graph already contains Aurora. Avoid an unconditional configure:
          # it reruns vcpkg and can invalidate thousands of reusable WebKit objects.
          # CMake/Ninja still regenerates automatically when tracked configure inputs change.
          cmd /c "call `"$vcvars`" && cmake --build `"$buildDir`" --target Aurora --config Release"
          if ($LASTEXITCODE -ne 0) { throw "Building the Aurora target failed with exit code $LASTEXITCODE" }

      - name: Package Aurora with matching WebKit runtime files
        env:
          WEBKIT_SHA: ${{ steps.webkit-sha.outputs.sha }}
        shell: powershell
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $release = Join-Path $env:WEBKIT_DIR "WebKitBuild\Release"
          $bin64 = Join-Path $release "bin64"
          $bin = Join-Path $release "bin"
          $libs = Join-Path $env:WEBKIT_DIR "WebKitLibraries\win\bin"

          $binaryDirectories = @($bin64, $bin) | Where-Object { Test-Path -LiteralPath $_ -PathType Container }
          if ($binaryDirectories.Count -eq 0) { throw "WebKit Release bin/bin64 directories were not found under $release" }

          function Find-WebKitRuntimeFile([string]$name) {
            foreach ($directory in $binaryDirectories) {
              $candidate = Join-Path $directory $name
              if (Test-Path -LiteralPath $candidate -PathType Leaf) { return $candidate }
            }
            return $null
          }

          $versionText = @(
            "WebKit SHA: $env:WEBKIT_SHA",
            "Aurora SHA: ${{ github.sha }}",
            "Aurora source ref: $env:AURORA_REF",
            "Build time (UTC): $((Get-Date).ToUniversalTime().ToString("o"))"
          ) -join "`r`n"

          # The configured target build links the freshly built app to bin\Aurora.exe.
          # Do not prefer bin64: the restored WebKit cache can contain a stale Aurora.exe there.
          $auroraExe = Join-Path $bin "Aurora.exe"
          if (-not (Test-Path -LiteralPath $auroraExe -PathType Leaf)) {
            throw "Freshly built Aurora.exe was not found at $auroraExe. Refusing to package a possibly stale executable from another directory."
          }
          $auroraExeInfo = Get-Item -LiteralPath $auroraExe
          Write-Host "Packaging freshly linked Aurora target: $($auroraExeInfo.FullName)"
          Write-Host "Executable last-write UTC: $($auroraExeInfo.LastWriteTimeUtc.ToString('o'))"

          $requiredHelpers = @("WebKitWebProcess.exe", "WebKitNetworkProcess.exe", "WebKitGPUProcess.exe")
          $helperPaths = @{}
          foreach ($helper in $requiredHelpers) {
            $helperPath = Find-WebKitRuntimeFile $helper
            if (-not $helperPath) { throw "Required WebKit helper process $helper was not found under $release" }
            $helperPaths[$helper] = $helperPath
          }
          $runtimeDlls = @()
          foreach ($directory in @($bin64, $bin, $libs)) {
            if (Test-Path -LiteralPath $directory -PathType Container) {
              $runtimeDlls += @(Get-ChildItem -LiteralPath $directory -Filter "*.dll" -File -ErrorAction Stop)
            }
          }
          if ($runtimeDlls.Count -eq 0) { throw "No WebKit runtime DLLs were found in bin, bin64, or WebKitLibraries\win\bin." }
          $engineDlls = @($runtimeDlls | Where-Object { $_.DirectoryName -in $binaryDirectories })
          foreach ($requiredDll in @("JavaScriptCore.dll", "WebCore.dll", "WebKit2.dll")) {
            if ($engineDlls.Name -notcontains $requiredDll) { throw "Required WebKit runtime DLL $requiredDll was not found in bin or bin64." }
          }

          $webkitResources = $null
          foreach ($directory in $binaryDirectories) {
            $candidate = Join-Path $directory "WebKit.resources"
            if (Test-Path -LiteralPath $candidate -PathType Container) { $webkitResources = $candidate; break }
          }
          if (-not $webkitResources) { throw "Required WebKit.resources directory was not found under $release\bin or bin64." }
          if (-not (Get-ChildItem -LiteralPath $webkitResources -File -Recurse -ErrorAction Stop | Select-Object -First 1)) {
            throw "WebKit.resources exists but contains no files: $webkitResources"
          }

          $resources = Join-Path $release "Resources"
          $hasAdditionalResources = $false
          if (Test-Path -LiteralPath $resources -PathType Container) {
            $hasAdditionalResources = [bool](Get-ChildItem -LiteralPath $resources -File -Recurse -ErrorAction Stop | Select-Object -First 1)
          }

          $pkg = Join-Path $out "Aurora"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          $versionPath = Join-Path $pkg "VERSION.txt"
          $resOut = Join-Path $pkg "Resources"
          $libOut = Join-Path $pkg "lib"
          $shareOut = Join-Path $pkg "share"
          New-Item -ItemType Directory -Force -Path $resOut | Out-Null
          New-Item -ItemType Directory -Force -Path $libOut | Out-Null
          New-Item -ItemType Directory -Force -Path $shareOut | Out-Null

          Set-Content -Path $versionPath -Value $versionText -NoNewline
          Copy-Item -LiteralPath $auroraExe -Destination $pkg -Force
          foreach ($helperPath in $helperPaths.Values) {
            Copy-Item -LiteralPath $helperPath -Destination $pkg -Force
          }
          foreach ($runtimeDll in ($runtimeDlls | Sort-Object FullName -Unique)) {
            Copy-Item -LiteralPath $runtimeDll.FullName -Destination $pkg -Force
          }
          Copy-Item -LiteralPath $webkitResources -Destination (Join-Path $pkg "WebKit.resources") -Recurse -Force
          if ($hasAdditionalResources) { Copy-Item (Join-Path $resources "*") $resOut -Recurse -Force }
          # Always stage Aurora-owned branding images beside the packaged executable.
          $projectResources = Join-Path $env:GITHUB_WORKSPACE "Resources"
          foreach ($brandAsset in @("aurora-logo.png", "aurora-about-cover.jpg")) {
            $sourceAsset = Join-Path $projectResources $brandAsset
            if (-not (Test-Path -LiteralPath $sourceAsset -PathType Leaf)) { throw "Required Aurora branding asset is missing: $sourceAsset" }
            Copy-Item -LiteralPath $sourceAsset -Destination (Join-Path $resOut $brandAsset) -Force
          }
          foreach ($brandAsset in @("aurora-logo.png", "aurora-about-cover.jpg")) {
            if (-not (Test-Path -LiteralPath (Join-Path $resOut $brandAsset) -PathType Leaf)) { throw "Branding asset was not staged: $brandAsset" }
          }

          $libDir = Join-Path $release "lib"
          if (Test-Path $libDir) { Copy-Item (Join-Path $libDir "*") $libOut -Recurse -Force }
          $shareDir = Join-Path $release "share"
          if (Test-Path $shareDir) { Copy-Item (Join-Path $shareDir "*") $shareOut -Recurse -Force }
          foreach ($directory in $binaryDirectories) {
            Get-ChildItem -LiteralPath $directory -File -ErrorAction Stop | Where-Object { $_.Extension -in ".dat", ".pak" } | Copy-Item -Destination $pkg -Force
          }

          foreach ($requiredFile in @("Aurora.exe", "WebKitWebProcess.exe", "WebKitNetworkProcess.exe", "WebKitGPUProcess.exe", "JavaScriptCore.dll", "WebCore.dll", "WebKit2.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $pkg $requiredFile) -PathType Leaf)) { throw "Required package file was not staged: $requiredFile" }
          }
          if (-not (Get-ChildItem -LiteralPath (Join-Path $pkg "WebKit.resources") -File -Recurse -ErrorAction Stop | Select-Object -First 1)) {
            throw "WebKit.resources was not staged correctly."
          }

          # Branch names may contain "/" (for example, fix/example). Replace
          # characters that are invalid in Windows file names before creating the ZIP.
          $safeRefName = $env:AURORA_REF -replace '[\\/:*?"<>|]', '-'
          if ([string]::IsNullOrWhiteSpace($safeRefName)) { $safeRefName = $env:GITHUB_SHA }
          $zipName = "Aurora-windows-x64-$safeRefName.zip"
          $zipPath = Join-Path $out $zipName
          Compress-Archive -Path (Join-Path $pkg "*") -DestinationPath $zipPath -Force

      - name: Save updated WebKit snapshot
        id: save-webkit-snapshot
        if: success() && steps.cache-webkit-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WEBKIT_DIR }}
          key: webkit-src-v3-${{ runner.os }}-${{ steps.webkit-sha.outputs.sha }}-${{ steps.build-fingerprint.outputs.fingerprint }}-${{ hashFiles('CMakeLists.txt', 'cmake/WebKitProjectHook.cmake') }}

      - name: Pin successfully saved WebKit revision
        id: pin-webkit-sha
        if: success() && github.event_name == 'workflow_dispatch' && inputs.rebuild_webkit == true && steps.save-webkit-snapshot.outcome == 'success'
        env:
          WEBKIT_SHA: ${{ steps.webkit-sha.outputs.sha }}
        shell: powershell
        run: |
          $workflowPath = Join-Path $env:GITHUB_WORKSPACE ".github\workflows\build-aurora.yml"
          $content = Get-Content -LiteralPath $workflowPath -Raw
          $pinPattern = '(?m)^\s*\$knownGoodSha = "([0-9a-fA-F]{40})"

      - name: Remove superseded WebKit caches
        if: success() && steps.save-webkit-snapshot.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ github.ref }}
          CURRENT_WEBKIT_CACHE_KEY: webkit-src-v3-${{ runner.os }}-${{ steps.webkit-sha.outputs.sha }}-${{ steps.build-fingerprint.outputs.fingerprint }}-${{ hashFiles('CMakeLists.txt', 'cmake/WebKitProjectHook.cmake') }}
        shell: powershell
        run: |
          try {
            $repository = $env:TARGET_REPOSITORY
            if ([string]::IsNullOrWhiteSpace($repository) -or $repository -notmatch '^[^/]+/[^/]+$') {
              throw "Repository context is invalid: '$repository'."
            }
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $escapedRef = [System.Uri]::EscapeDataString($env:TARGET_REF)
            $baseUri = "https://api.github.com/repos/$($repository)/actions/caches"
            $null = [System.Uri]$baseUri
            $toDelete = @()
            $page = 1
            do {
              $uri = "$($baseUri)?ref=$escapedRef&per_page=100&page=$page"
              $null = [System.Uri]$uri
              $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
              $pageCaches = @($response.actions_caches)
              foreach ($cache in $pageCaches) {
                $isWebKitCache = ($cache.key -like "webkit-src-*") -or ($cache.key -like "webkit-build-Windows-*")
                if ($isWebKitCache -and $cache.key -ne $env:CURRENT_WEBKIT_CACHE_KEY) {
                  $toDelete += $cache
                }
              }
              $page++
            } while ($pageCaches.Count -eq 100)

            foreach ($cache in $toDelete) {
              $deleteUri = "$($baseUri)/$($cache.id)"
              $null = [System.Uri]$deleteUri
              Invoke-RestMethod -Method Delete -Uri $deleteUri -Headers $headers | Out-Null
              Write-Host "Removed superseded WebKit cache: $($cache.key) (id $($cache.id))"
            }
          } catch {
            Write-Warning "WebKit cache cleanup failed: $($_.Exception.Message). The saved engine cache and Aurora artifact must not be invalidated by cleanup."
          }

      - name: Upload Aurora artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-windows-x64
          path: ${{ github.workspace }}/dist/*.zip
          if-no-files-found: error

          $pinMatches = [regex]::Matches($content, $pinPattern)
          if ($pinMatches.Count -ne 1) {
            throw "Could not locate exactly one pinned WebKit SHA in the workflow. The old cache will be kept."
          }
          $currentPinnedSha = $pinMatches[0].Groups[1].Value.ToLowerInvariant()
          $rebuiltSha = $env:WEBKIT_SHA.ToLowerInvariant()

          if ($currentPinnedSha -eq $rebuiltSha) {
            Write-Host "The rebuilt WebKit SHA is already pinned. No workflow commit is needed."
          } else {
            $pattern = '(?m)^(\s*\$knownGoodSha = ")[0-9a-fA-F]{40}("$)'
            $replacement = '$1' + $env:WEBKIT_SHA + '$2'
            $content = [regex]::Replace($content, $pattern, $replacement, 1)
            [System.IO.File]::WriteAllText($workflowPath, $content, [System.Text.UTF8Encoding]::new($false))

            git config user.name "github-actions[bot]"
            git config user.email "41898282+Takayuushi@users.noreply.github.com"
            git add -- ".github/workflows/build-aurora.yml"
            git commit -m "Pin saved WebKit snapshot $env:WEBKIT_SHA"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit the new WebKit SHA. The older cache will be kept." }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw "Could not push the new WebKit SHA pin. The older cache will be kept." }
          }

      - name: Remove superseded WebKit caches
        if: success() && steps.save-webkit-snapshot.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ github.ref }}
          CURRENT_WEBKIT_CACHE_KEY: webkit-src-v3-${{ runner.os }}-${{ steps.webkit-sha.outputs.sha }}-${{ steps.build-fingerprint.outputs.fingerprint }}-${{ hashFiles('CMakeLists.txt', 'cmake/WebKitProjectHook.cmake') }}
        shell: powershell
        run: |
          try {
            $repository = $env:TARGET_REPOSITORY
            if ([string]::IsNullOrWhiteSpace($repository) -or $repository -notmatch '^[^/]+/[^/]+$') {
              throw "Repository context is invalid: '$repository'."
            }
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $escapedRef = [System.Uri]::EscapeDataString($env:TARGET_REF)
            $baseUri = "https://api.github.com/repos/$($repository)/actions/caches"
            $null = [System.Uri]$baseUri
            $toDelete = @()
            $page = 1
            do {
              $uri = "$($baseUri)?ref=$escapedRef&per_page=100&page=$page"
              $null = [System.Uri]$uri
              $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
              $pageCaches = @($response.actions_caches)
              foreach ($cache in $pageCaches) {
                $isWebKitCache = ($cache.key -like "webkit-src-*") -or ($cache.key -like "webkit-build-Windows-*")
                if ($isWebKitCache -and $cache.key -ne $env:CURRENT_WEBKIT_CACHE_KEY) {
                  $toDelete += $cache
                }
              }
              $page++
            } while ($pageCaches.Count -eq 100)

            foreach ($cache in $toDelete) {
              $deleteUri = "$($baseUri)/$($cache.id)"
              $null = [System.Uri]$deleteUri
              Invoke-RestMethod -Method Delete -Uri $deleteUri -Headers $headers | Out-Null
              Write-Host "Removed superseded WebKit cache: $($cache.key) (id $($cache.id))"
            }
          } catch {
            Write-Warning "WebKit cache cleanup failed: $($_.Exception.Message). The saved engine cache and Aurora artifact must not be invalidated by cleanup."
          }

      - name: Upload Aurora artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-windows-x64
          path: ${{ github.workspace }}/dist/*.zip
          if-no-files-found: error
